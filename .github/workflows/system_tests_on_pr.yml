name: Run system tests on PR

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/setup-gradle@v3
      - name: Build system-test image
        shell: bash
        run: docker build -t edc-systest system-tests
      - name: Run data plane test
        uses: ./.github/actions/checks/system-tests
        with:
          test_name: "aas-data-plane"
      - name: Run provider test
        uses: ./.github/actions/checks/system-tests
        with:
          test_name: "provider"
      - name: Run standalone test
        uses: ./.github/actions/checks/system-tests
        with:
          test_name: "standalone"
