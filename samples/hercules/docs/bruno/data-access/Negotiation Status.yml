info:
  name: Negotiation Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{p2-management-api}}/contractnegotiations/:negotiation-id"
  headers:
    - name: content-type
      value: application/json
    - name: x-api-key
      value: password
  params:
    - name: negotiation-id
      value: "{{data-access-contract-negotiation-id}}"
      type: path
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.contractAgreementId
        method: jsonq
      variable:
        name: agreement-id
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
