info:
  name: Request Credentials
  type: http
  seq: 4

http:
  method: POST
  url: http://localhost:8082/api/identity/v1alpha/participants/{{participantContextId}}/credentials/request
  body:
    type: json
    data: |-
      {
        "credentials": [
          {
            "id": "MC-Cred-Def",
            "type": "MembershipCredential",
            "format": "VC1_0_JWT"
          }
        ],
        "issuerDid": "did:web:hercules-issuer%3A8083"
      }
  auth: inherit

runtime:
  variables:
    - name: participantContextId
      value: ZGlkOndlYjpoZXJjdWxlcy13YWxsZXQlM0E4MDg0OnBhcnRpY2lwYW50MQ

settings:
