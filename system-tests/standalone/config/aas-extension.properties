edc.aas.localAASModelPath=/system-tests/resources/aas.json
edc.aas.localAASServiceConfigPath=/config/fa3st-config.json
edc.aas.onlySubmodels=false
edc.aas.allowSelfSignedCertificates=true
edc.aas.useAasDataPlane=false
edc.dataplane.aas.acceptForeignSelfSignedCertificates=false
edc.dataplane.aas.acceptOwnSelfSignedCertificates=true
# EDC-CONNECTOR-CLIENT CONFIG
edc.controlplane.management.url=http://provider:13338/management/v4
edc.controlplane.auth.key=password

# EDC CONFIG
edc.vault.hashicorp.url=http://vault:8200
edc.vault.hashicorp.token=root
edc.vault.hashicorp.api.secret.path=/v1/secret
edc.vault.hashicorp.health.check.enabled=true
edc.hostname=standalone
edc.participant.id=provider
edc.participant.context.id=provider
web.http.port=18281
web.http.path=/api
web.http.default.auth.type=tokenbased
web.http.default.auth.key.alias=standalone
# If no vault is running, this will be used as x-api-key password
web.http.default.auth.key=password
edc.web.rest.cors.enabled=true
edc.web.rest.cors.origins=*
edc.web.rest.cors.headers=*
edc.web.rest.cors.methods=GET, POST, DELETE, PUT, OPTIONS
